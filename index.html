
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crime Lab Puzzle Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Teko:wght@300..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto Condensed', sans-serif;
        }
        .font-teko {
            font-family: 'Teko', sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInSlow {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .animate-fade-in-fast {
            animation: fadeIn 0.2s ease-out forwards;
        }
        .animate-fade-in-slow {
            animation: fadeInSlow 1s ease-out forwards;
            opacity: 0; /* Start hidden */
        }
        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        @keyframes shrinkOut {
            from { transform: scale(1); opacity: 1; max-height: 500px; margin-bottom: 1rem; }
            to { transform: scale(0.95); opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
        }
        .animate-shrink-out {
            animation: shrinkOut 0.5s ease-out forwards;
            overflow: hidden;
        }
         @layer base {
            .animate-fade-in {
                animation: fadeIn 0.5s ease-in-out;
            }
            .animate-fade-in-fast {
                animation: fadeIn 0.2s ease-in-out;
            }
            .animate-shake {
                animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes shake {
              10%, 90% { transform: translate3d(-1px, 0, 0); }
              20%, 80% { transform: translate3d(2px, 0, 0); }
              30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
              40%, 60% { transform: translate3d(4px, 0, 0); }
            }
            .animate-fizz {
                animation: fizz 1s ease-in-out forwards;
            }
            @keyframes fizz {
                0% { transform: scale(0.5); opacity: 0; }
                50% { transform: scale(1.2); opacity: 1; }
                100% { transform: scale(1.5); opacity: 0; }
            }
            .animate-sparkle {
                animation: sparkle 0.8s ease-in-out forwards;
            }
            @keyframes sparkle {
                0%, 100% { opacity: 0; transform: scale(0); }
                50% { opacity: 1; transform: scale(1.2) rotate(15deg); }
            }
            @keyframes peel-off {
                0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
                50% { transform: translate(0, 0) rotate(5deg); opacity: 1; }
                100% { transform: translate(-100px, -150px) rotate(-30deg); opacity: 0; }
            }
            .animate-peel-off {
                animation: peel-off 1.5s ease-in-out forwards;
            }
            @keyframes pulse-glow {
                0%, 100% { box-shadow: 0 0 3px 1px rgba(234, 179, 8, 0.2); }
                50% { box-shadow: 0 0 10px 3px rgba(251, 191, 36, 0.5); }
            }
            .animate-pulse-glow {
                animation: pulse-glow 3s infinite ease-in-out;
            }
        }
    </style>
